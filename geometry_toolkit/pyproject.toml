[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry-toolkit"
version = "0.1.0"
description = "A Python computational geometry toolkit with visualization"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["geometry_toolkit*"]
